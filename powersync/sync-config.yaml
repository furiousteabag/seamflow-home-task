# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_config.json
config:
  edition: 3

streams:
  # Each signed-in user gets only their own items
  my_items:
    auto_subscribe: true
    query: SELECT id, title, source, user_id, created_at FROM items WHERE user_id = auth.user_id()
